# Default values for banzai-web-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.lco.global/banzai-web-frontend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  paths:
    - '/'
  hosts:
    - chart-example.local
  tls: []
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 32Mi

nodeSelector: {}

tolerations: []

affinity: {}
