# Default values for banzai-web-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.lco.global/banzai-web-frontend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

banzaiWebApiUrl: 'https://banzai-web-api.lco.earth/'

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx-lco-earth
    cert-manager.io/cluster-issuer: letsencrypt-lco-earth
  hosts:
    - host: 'banzai-web.lco.earth'
      paths:
        - path: /
          pathType: ImplementationSpecific
