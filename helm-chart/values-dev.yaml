# Default values for banzai-web-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.lco.global/banzai-web-frontend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

banzaiWebApiUrl: 'http://banzai-web-api-dev.lco.gtn/'

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx-ingress-private
  hosts:
    - host: 'banzai-web-dev.lco.gtn'
      paths:
        - path: /
          pathType: ImplementationSpecific
