# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      volumes:
      - configMap:
        name: app-configuration
      - emptyDir: {}
        name: nginx-var-cache-nginx
      - emptyDir: {}
        name: init
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: nginx-var-run
      containers:
        - name: frontend
          image: banzai-web-frontend
          env:
          - name: DISABLE_OVERWRITE_APP_CONFIG_IN_ENTRYPOINT
            value: "true"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 500m
              memory: 32Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          volumeMounts:
          - mountPath: /app/config
            name: app-configuration
            readOnly: true
          - mountPath: /var/cache/nginx
            name: nginx-var-cache-nginx
          - mountPath: /var/run
            name: nginx-var-run
          - mountPath: /init
            name: init
